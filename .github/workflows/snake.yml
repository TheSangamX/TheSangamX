name: Contribution snake

# Draws the last year of contributions in the site's colours, light and dark, onto the "output" branch.
on:
  schedule:
    - cron: "41 2 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#16181d&color_dots=#eceef2,#c9cdf6,#959ff0,#5d6ae4,#2a3cdb
            dist/snake-dark.svg?color_snake=#e8eaef&color_dots=#161b22,#232a5c,#3a46a8,#6370e6,#8d98ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
